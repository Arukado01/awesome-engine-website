name: Validate and deploy website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_CONTACT_ENABLED: ${{ github.ref == 'refs/heads/main' && vars.CONTACT_BACKEND_DEPLOYED == 'true' && 'true' || 'false' }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      PUBLIC_CONTACT_ENDPOINT: /api/contact
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Check contact activation settings
        shell: bash
        run: |
          if [[ "$PUBLIC_CONTACT_ENABLED" == "true" && -z "$PUBLIC_TURNSTILE_SITE_KEY" ]]; then
            echo '::error::CONTACT_BACKEND_DEPLOYED requires the PUBLIC_TURNSTILE_SITE_KEY repository variable.'
            exit 1
          fi
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate frontend TypeScript
        run: npm run check
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend data and behavior
        run: npm test
      - name: Build production website
        run: npm run build
      - name: Install backend dependencies
        run: npm --prefix functions ci
      - name: Validate backend TypeScript, lint, tests and build
        run: npm --prefix functions run check
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test browser interactions, responsive layouts and accessibility
        env:
          PUBLIC_CONTACT_ENABLED: 'false'
          PUBLIC_TURNSTILE_SITE_KEY: ''
        run: npm run test:e2e
      - name: Store browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Store validated production files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Explain fork preview boundary
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: echo 'Validation completed. Fork pull requests do not receive Firebase credentials or deploy previews.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy production Hosting
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    environment:
      name: production
      url: https://awesome-engine-web-arukado.web.app
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download validated website
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: website-dist
          path: dist
      - name: Set up deployment runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Require the Hosting deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AWESOME_ENGINE }}
        shell: bash
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo '::error::Missing FIREBASE_SERVICE_ACCOUNT_AWESOME_ENGINE. Configure the repository secret following docs/DEPLOYMENT.md; no deployment was performed.'
            exit 1
          fi
      - name: Route contact to the previously deployed backend
        if: vars.CONTACT_BACKEND_DEPLOYED == 'true'
        run: cp firebase.functions.json firebase.json
      - name: Deploy the live Hosting channel
        id: hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AWESOME_ENGINE }}
          projectId: awesome-engine-web-arukado
          channelId: live
          firebaseToolsVersion: 15.31.0
          disableComment: true
      - name: Verify public pages
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 3 https://awesome-engine-web-arukado.web.app/ --output /dev/null
          curl --fail --silent --show-error --retry 3 https://awesome-engine-web-arukado.web.app/docs/introduccion/ --output /dev/null
          echo '[Production website](https://awesome-engine-web-arukado.web.app)' >> "$GITHUB_STEP_SUMMARY"

  preview:
    outputs:
      url: ${{ steps.hosting.outputs.details_url }}
    name: Deploy a preview for a trusted pull request
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download validated website
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: website-dist
          path: dist
      - name: Set up deployment runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Require the Hosting deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AWESOME_ENGINE }}
        shell: bash
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo '::error::Missing FIREBASE_SERVICE_ACCOUNT_AWESOME_ENGINE. Validation passed, but this preview cannot deploy until the repository secret is configured.'
            exit 1
          fi
      - name: Deploy a temporary Hosting channel
        id: hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AWESOME_ENGINE }}
          projectId: awesome-engine-web-arukado
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d
          firebaseToolsVersion: 15.31.0
          disableComment: true
      - name: Publish preview URL in this run's summary
        env:
          PREVIEW_URL: ${{ steps.hosting.outputs.details_url }}
        shell: bash
        run: printf '[Open the preview](%s) (expires in 7 days). Contact submission stays disabled on previews.\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

  verify-deployment:
    name: Verify the deployed website in a browser
    needs: [deploy, preview]
    if: always() && (needs.deploy.result == 'success' || needs.preview.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.deploy.result == 'success' && 'https://awesome-engine-web-arukado.web.app' || needs.preview.outputs.url }}
    steps:
      - name: Check out verification code without deployment credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up the verified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Test actual pages, interaction and video playback on Hosting
        run: npm run test:live
      - name: Keep deployed-site diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployed-browser-diagnostics
          path: test-results/live/
          if-no-files-found: ignore
          retention-days: 7
